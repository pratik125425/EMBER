[project]
name = "ember"
version = "0.1.0"
description = "EMBER: Evidence-Mapped Bounds for Exploration fire Risk (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pint>=0.24",
    "pydantic>=2.8",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "streamlit>=1.38",
    "plotly>=5.24",
    "rank_bm25>=0.2.2",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
# Heavy retrieval deps are optional so the core engine installs fast (spec §0.11: keep deps minimal).
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
dev = ["pytest>=8.3", "ruff>=0.6", "pre-commit>=3.8"]
llm = [
    "anthropic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
