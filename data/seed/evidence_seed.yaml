# EMBER seed evidence (spec Appendix A). Campaign-level envelopes only, until per-test PSI
# tables are parsed (T11). Values not listed stay unknown. Locators marked "TODO" are
# collected into data/curated/review_todo.csv and must be filled from the opened document.
#
# Deviations from Appendix A (listed in the T05 summary):
#  - SAFFIRE6:PMMA_SIBAL split into SAFFIRE6:SIBAL (thin_solid) and SAFFIRE6:PMMA (thick_solid)
#    because fuel_class is a single enum. Same conditions and source for both.
#  - BASS-II:LOC_1g added as the 1-g counterpart row (Link et al. 2018, LOC ≈ 0.18 at 1-g).
#  - Source id "NASA DAFT fact sheet 2025" written as NASA-DAFT-FACTSHEET-2025 (no spaces in ids).

- evidence_id: BASS-II:campaign
  investigation: BASS-II
  psi_id: PSI-25
  hardware_family: MSG+SPICE-duct
  fuel_class: thick_solid
  fuel_name: PMMA rods/slabs (also thin fuels)
  phenomena: [spread_opposed, spread_concurrent, extinction, limiting_oxygen]
  gravity: microgravity
  x_o2: {min: 0.136, max: 0.222, status: known, source_id: PSI-25, source_locator: "PSI-25_Experimental table_BASS-II.csv · col 'Calibrated initial O2 % by vol' · min–max over 129 data rows (13.6–22.2%)"}
  o2_context: ambient
  p_kpa: {status: unknown}          # fill from matrix
  u_cms: {min: 0.0, max: 40.0, status: known, source_id: PSI-25, source_locator: "PSI-25 record (PSI web service JSON) · Approach: 'airflow speeds up to 40 cm/s'"}
  flow_direction: unknown
  granularity: per_test_table       # downgrade to campaign_summary if matrix not obtained
  tensions: []
  sources: [PSI-25, "DOI:10.1038/s41598-017-18398-4"]

