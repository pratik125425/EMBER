# EMBER gold-set queries (spec §12.1, Appendix B). STATUS: DRAFT — confirm every scenario, then freeze.
#
# Each query is the natural-language question plus the Scenario a user would confirm. Scenarios
# follow the parser rules of spec §11.2: % → fraction, psia → kPa (×6.89476), Moon → 0.166 g,
# Mars → 0.38 g, ISS/orbit → 0 g, "exploration atmosphere"/"lunar habitat" with no numbers →
# 0.34 / 56.5 kPa; anything not stated is null (airflow is never guessed).
# Phenomenon policy (needed because a Scenario must name one):
#   - "flammability"/"flame spread" with fabric or thin materials → spread_concurrent;
#     otherwise unspecified flame spread → spread_opposed.
#   - Where the question names no phenomenon, the closest one is chosen and noted.
# scenario: null marks a text-only question (dataset/meta questions). Those are scored for the text
# systems and reported separately; they are excluded from the paired EMBER-vs-baseline comparison.
# expected: "gap" marks questions the spec expects no PSI investigation to answer.

- {qid: Q01, group: exploration, text: "Fabric flammability in a lunar habitat at 34% O2, 8.2 psia.",
   scenario: {phenomenon: spread_concurrent, x_o2: 0.34, p_kpa: 56.5, gravity_g0: 0.166, fuel_class: thin_solid}}
- {qid: Q02, group: exploration, text: "PMMA flame spread at 34% O2 with 10 cm/s ventilation.",
   scenario: {phenomenon: spread_opposed, x_o2: 0.34, u_cms: 10.0, fuel_class: thick_solid, fuel_name: PMMA},
   notes: "direction not stated → opposed (policy); pressure and gravity not stated"}
- {qid: Q03, group: exploration, text: "Which tests are closest to the 10.2 psia / 26.5% option?",
   scenario: {phenomenon: spread_opposed, x_o2: 0.265, p_kpa: 70.3}, notes: "phenomenon not stated → flame spread (policy)"}
