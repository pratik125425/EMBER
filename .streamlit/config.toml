# Charcoal instrument: a #090c13 canvas, blue-grey #111a29 data surfaces, frosted glass for the
# sidebar and floating chrome, one ember-orange mark for the scenario (sliders, reticle, primary
# action) and gold for NASA reference atmospheres. The values repeat ember/ui/palette.py (DARK);
# tests/test_palette.py keeps them in step. Libre Caslon sets titles, Libre Franklin the text and
# controls; both are bundled under app/static/fonts (SIL OFL), so nothing is fetched.
[theme]
base = "dark"
primaryColor = "#ff8a4c"
backgroundColor = "#090c13"
secondaryBackgroundColor = "#162133"
textColor = "#f2f4f8"
linkColor = "#a9c2ee"
borderColor = "#263247"
dataframeHeaderBackgroundColor = "#162133"
chartCategoricalColors = ["#86b1f2", "#e7a0b4", "#6fd0a8", "#e3c46e", "#c9a3e8", "#b7d77a", "#a99cf0", "#ff8f8f"]
font = "Libre Franklin"
headingFont = "Libre Caslon Text"
codeFont = "monospace"
headingFontWeights = [500, 500, 500, 600, 600, 600]
headingFontSizes = ["2.6rem", "1.6rem", "1.25rem", "1.05rem", "1rem", "0.9rem"]
baseFontSize = 15
metricValueFontWeight = 500
showWidgetBorder = true
baseRadius = "11px"
buttonRadius = "11px"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-VF.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-Italic-VF.ttf"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Libre Caslon Text"
url = "app/static/fonts/LibreCaslonText-VF.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Libre Caslon Text"
url = "app/static/fonts/LibreCaslonText-Italic-VF.ttf"
weight = "400 700"
style = "italic"

[[theme.fontFaces]]
family = "Libre Caslon Display"
url = "app/static/fonts/LibreCaslonDisplay-Regular.ttf"
weight = "400"
style = "normal"

[theme.sidebar]
backgroundColor = "#0d131e"
secondaryBackgroundColor = "#162133"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
