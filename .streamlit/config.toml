# Formal scientific look: warm off-white (or near-black) surface, hairline borders, one accent
# (the scenario violet), serif headings over a sans body. Every font is one Streamlit already
# bundles (Source Serif / Source Sans / Source Code), so nothing is fetched from the network.
# Light and dark are both defined; the viewer picks one under ⋮ → Settings → Theme.
[theme]
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["2.35rem", "1.55rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
baseFontSize = 15
metricValueFontWeight = 600
showWidgetBorder = true
baseRadius = "small"
buttonRadius = "small"

[theme.light]
primaryColor = "#6250d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
linkColor = "#4a3aa7"
borderColor = "#e1e0d9"
dataframeHeaderBackgroundColor = "#f3f2ee"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#f6f5f1"

[theme.dark]
primaryColor = "#9085e9"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#242423"
textColor = "#f0efec"
linkColor = "#b3abf2"
borderColor = "#383835"
dataframeHeaderBackgroundColor = "#242423"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#161615"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
