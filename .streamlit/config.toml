# Atlas-plate world: a deep navy plate, ivory engraving ink, steel-blue graticule hairlines and one
# ember-orange mark reserved for the scenario (sliders, reticle, primary action). Libre Caslon sets
# the plate titling, Libre Franklin the margin text and controls. Both are bundled under
# app/static/fonts (SIL OFL) and served by Streamlit itself, so nothing is fetched from the network.
# The plate is the default; Streamlit's built-in Light theme (⋮ → Settings) gives a white-sky print.
[theme]
base = "dark"
primaryColor = "#ff8a4c"
backgroundColor = "#12213f"
secondaryBackgroundColor = "#192b52"
textColor = "#efe9da"
linkColor = "#a9c6ff"
borderColor = "#2c406c"
dataframeHeaderBackgroundColor = "#0d1830"
chartCategoricalColors = ["#86b1f2", "#e7a0b4", "#6fd0a8", "#e3c46e", "#c9a3e8", "#b7d77a", "#a99cf0", "#ff8f8f"]
font = "Libre Franklin"
headingFont = "Libre Caslon Text"
codeFont = "monospace"
headingFontWeights = [500, 500, 500, 600, 600, 600]
headingFontSizes = ["2.6rem", "1.6rem", "1.25rem", "1.05rem", "1rem", "0.9rem"]
baseFontSize = 15
metricValueFontWeight = 500
showWidgetBorder = true
baseRadius = "2px"
buttonRadius = "2px"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-VF.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-Italic-VF.ttf"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Libre Caslon Text"
url = "app/static/fonts/LibreCaslonText-VF.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Libre Caslon Text"
url = "app/static/fonts/LibreCaslonText-Italic-VF.ttf"
weight = "400 700"
style = "italic"

[[theme.fontFaces]]
family = "Libre Caslon Display"
url = "app/static/fonts/LibreCaslonDisplay-Regular.ttf"
weight = "400"
style = "normal"

[theme.sidebar]
backgroundColor = "#0d1830"
secondaryBackgroundColor = "#152447"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = true
